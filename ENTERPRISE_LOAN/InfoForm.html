<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="script.js" defer></script>
    <title>Enterprise Loan Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
        }
        h2 {
            text-align: center;
            color: #0A0A66;
        }
        label {
            font-weight: bold;
            display: block;
            margin-top: 10px;
            color: #0A0A66;
        }
        input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-top: 5px;
        }
        .btn-container {
            display: flex;
            justify-content: center;
            margin-top: 20px;
            gap: 20px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 10px 20px;
            font-size: 16px;
            border: 2px solid;
            cursor: pointer;
            border-radius: 20px;
            width: 120px;
            transition: all 0.3s ease;
        }
        .btn:hover {
            opacity: 0.8;
        }
        .btn-back {
            border-color: blue;
            color: blue;
            background: white;
        }
        .btn-next {
            border-color: orange;
            color: orange;
            background: white;
        }
        .btn-back:hover{
            background: blue;
            color: white;
        }
        .btn-next:hover {
            background: orange;
            color: white;
        }
        @media (max-width: 600px) {
            .btn-container {
                flex-direction: column;
                align-items: center;
            }
            .btn {
                width: 100%;
                margin-top: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Enterprise Loan</h2>
        <h3>Personal Information</h3>
        <label>Email:</label>
        <input type="email" id="email">
        
        <label>Name:</label>
        <input type="text" id="name">
        
        <label>Age:</label>
        <input type="number" id="age">
        
        <label>Address:</label>
        <input type="text" id="address">
        
        <label>Sex:</label>
        <input type="text" id="sex">
        
        <label>Birthdate:</label>
        <input type="date" id="birthdate">
        
        <label>Phone #:</label>
        <input type="tel" id="phone">
        
        <label>Status:</label>
        <input type="text" id="status">
        
        <label>Religion:</label>
        <input type="text" id="religion">

        <h3>Business Information</h3>
        <label>Business Name:</label>
        <input type="text" id="businessName">
        
        <label>Location:</label>
        <input type="text" id="businessLocation">
        
        <label>Years of Business Operates:</label>
        <input type="number" id="yearsBusiness">
        
        <label>Monthly Income:</label>
        <input type="number" id="income">
        
        <label>Contact #:</label>
        <input type="tel" id="businessContact">
        
        <div class="btn-container">
            <button class="btn btn-back" onclick="goBack()">BACK</button>
            <button class="btn btn-next" id="submitButton">NEXT</button>
        </div>
    </div>

    <script>
        function goBack() {
            window.location.href = "../index.html";
        }

        document.getElementById('submitButton').addEventListener('click', function() {
            const formData = {
                email: document.getElementById('email').value,
                name: document.getElementById('name').value,
                age: document.getElementById('age').value,
                address: document.getElementById('address').value,
                sex: document.getElementById('sex').value,
                birthdate: document.getElementById('birthdate').value,
                phone: document.getElementById('phone').value,
                status: document.getElementById('status').value,
                religion: document.getElementById('religion').value,
                businessName: document.getElementById('businessName').value,
                businessLocation: document.getElementById('businessLocation').value,
                yearsBusiness: document.getElementById('yearsBusiness').value,
                income: document.getElementById('income').value,
                businessContact: document.getElementById('businessContact').value
            };

            localStorage.setItem('formData', JSON.stringify(formData));
            alert('Form data saved! Proceeding to the next step.');
            window.location.href = "RequirementForm.html";
        });
    </script>
</body>
</html>
