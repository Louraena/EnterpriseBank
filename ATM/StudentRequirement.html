<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="script.js" defer></script>
    <title>Student Requirements</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
        }
        h2 {
            text-align: center;
            color: #0A0A66;
        }
        label {
            font-weight: bold;
            display: block;
            margin-top: 10px;
            color: #0A0A66;
        }
        input[type="file"] {
            width: 100%;
            margin-top: 5px;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .buttons {
            display: flex;
            justify-content: center;
            margin-top: 20px;
            gap: 20px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 10px 20px;
            font-size: 16px;
            border: 2px solid;
            cursor: pointer;
            border-radius: 20px;
            width: 120px;
            transition: all 0.3s ease;
        }
        .btn:hover {
            opacity: 0.8;
        }
        .btn.btn-back {
            border-color: blue;
            color: blue;
            background: white;
        }
        .btn.btn-next {
            border-color: orange;
            color: orange;
            background: white;
        }
        .btn-back:hover {
            border-color: blue;
            color: white;
            background: blue;
        }
        .btn-next:hover {
            border-color: orange;
            color: white;
            background: orange;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Upload Required Documents</h2>

        <label for="idPictureInput">School ID (Present ID):</label>
        <input type="file" id="idPictureInput" accept="image/*">

        <label for="validID1Input">2x2 Picture:</label>
        <input type="file" id="validID1Input" accept="image/*">

        <div class="buttons">
            <a href="ATM_student.html"><button class="btn btn-back">BACK</button></a>
            <button class="btn btn-next" id="nextButton">NEXT</button>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const idPictureInput = document.getElementById("idPictureInput");
            const validID1Input = document.getElementById("validID1Input");
            const nextButton = document.getElementById("nextButton");

            // Load previously stored images (if available)
            if (localStorage.getItem("idPicture")) {
                idPictureInput.dataset.saved = "true";
            }
            if (localStorage.getItem("validID1")) {
                validID1Input.dataset.saved = "true";
            }

            function saveImage(inputElement, storageKey) {
                const file = inputElement.files[0];
                
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = function () {
                        localStorage.setItem(storageKey, reader.result);
                        inputElement.dataset.saved = "true"; // Mark as saved
                    };
                    reader.readAsDataURL(file);
                }
            }

            idPictureInput.addEventListener("change", function () {
                saveImage(this, "idPicture");
            });

            validID1Input.addEventListener("change", function () {
                saveImage(this, "validID1");
            });

            nextButton.addEventListener("click", function () {
                if (!idPictureInput.dataset.saved || !validID1Input.dataset.saved) {
                    alert("Please upload all required documents before proceeding.");
                } else {
                    window.location.href = "ReviewStudentInfo.html"; // Change to your actual next page
                }
            });
        });
    </script>

</body>
</html>
