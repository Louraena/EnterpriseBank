<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATM</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
        }
        h2 {
            color: #0A0A66;
        }
        .info {
            text-align: left;
            margin-top: 10px;
        }
        .info p {
            background: #F7941D;
            padding: 10px;
            color: #1E40AF;
            border-radius: 5px;
        }
        .buttons {
            display: flex;
            justify-content: center;
            margin-top: 20px;
            gap: 20px;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-block;
            text-align: center;
            line-height: 40px;
            padding: 10px 20px;
            font-size: 16px;
            border: 2px solid;
            cursor: pointer;
            border-radius: 20px;
            width: 150px;
            transition: all 0.3s ease;
            text-decoration: none;
        }
        .btn-student {
            border-color: blue;
            color: blue;
            background: white;
        }
        .btn-Employee {
            border-color: orange;
            color: orange;
            background: white;
        }
        .btn-Back {
            border-color: blue;
            color: blue;
            background: white;
        }
        .btn-Next {
            border-color: orange;
            color: orange;
            background: white;
        }
        .btn-Back:hover {
            background: blue;
            color: white;
        }
        .btn-Next:hover {
            background: orange;
            color: white;
        }
        .btn-student:hover {
            background: blue;
            color: white;
        }
        .btn-Employee:hover {
            background: orange;
            color: white;
        }
        @media (max-width: 480px) {
            .container {
                width: 90%;
            }
            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>ATM</h2>
        <div class="buttons">
            <a href="ATM_student.html" class="btn btn-student">Student</a>
            <a href="ATM_Employee.html" class="btn btn-Employee">Employee</a>
        </div>
        <div class="buttons" style="margin-top: 40px;">
            <a href="../index.html" class="btn btn-Back">Back</a>
        </div>
    </div>
</body>
</html>
