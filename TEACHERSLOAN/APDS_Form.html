<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="script.js"></script>
    <title>Personal Info</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
        }
        h2 {
            text-align: center;
            color: #0A0A66;
        }
        label {
            font-weight: bold;
            display: block;
            margin-top: 10px;
            color: #0A0A66;
        }
        input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-top: 5px;
        }
        .btn-container {
            display: flex;
            justify-content: center;
            margin-top: 20px;
            gap: 20px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 10px 20px;
            font-size: 16px;
            border: 2px solid;
            cursor: pointer;
            border-radius: 20px;
            width: 120px;
            transition: all 0.3s ease;
        }

        a{
            text-decoration: none;
        }
        .btn:hover {
            opacity: 0.8;
        }
        .btn btn-back {
            border-color: blue;
            color: blue;
            background: white;
        }
        .btn btn-next {
            border-color: orange;
            color: orange;
            background: white;
        }
        .btn-back:hover{
            border-color: blue;
            color: white;
            background: blue;
        }
        .btn-next:hover {
            border-color: orange;
            color: white;
            background: orange;
        }

        
        @media (max-width: 600px) {
            .btn-container {
                flex-direction: column;
                align-items: center;
            }
            .btn {
                width: 100%;
                margin-top: 10px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Personal Information</h2>
        <label>Email:</label>
        <input type="email" id="email">
        
        <label>Name:</label>
        <input type="text" id="name">
        
        <label>Age:</label>
        <input type="number" id="age">

        <label>Date of Birth:</label>
        <input type="date" id="birthdate">

        <label>Place of Birth:</label>
        <input type="text" id="birthplace">
        
        <label>Address:</label>
        <input type="text" id="address">
       

        <label>Status:</label>
        <input type="text" id="status">
        
        <label>Phone #:</label>
        <input type="tel" id="phone">
        

        <div class="btn-container">
            <a href="matrix.html"><button class="btn btn-back">BACK</button></a>
            <a href="APDS_requirement.html"><button class="btn btn-next" id="submitButton">NEXT</button></a>
        </div>
    </div>

    <script>
        // When 'NEXT' button is clicked, save the form data to localStorage
        document.getElementById('submitButton').addEventListener('click', function() {
            // Collect form values
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const age = document.getElementById('age').value;
            const address = document.getElementById('address').value;
            const birthdate = document.getElementById('birthdate').value;
            const status = document.getElementById('status').value;
            const phone = document.getElementById('phone').value;
            const birthplace = document.getElementById('birthplace').value;
            

            // Save values in localStorage
            localStorage.setItem('name', name);
            localStorage.setItem('email', email);
            localStorage.setItem('age', age);
            localStorage.setItem('address', address);
            localStorage.setItem('birthdate', birthdate);
            localStorage.setItem('status', status);
            localStorage.setItem('phone', phone);
            localStorage.setItem('birthplace', birthplace);
            

            
        });
    </script>
    
    
    
</body>
</html>
