<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit & Send PDF</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/emailjs-com@2/dist/email.min.js"></script>
    <script src="https://cdn.emailjs.com/dist/email.min.js"></script>
    <script src="script.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
        }
        h2 {
            color: #0A0A66;
        }
        .info {
            text-align: left;
            margin-top: 10px;
        }
        .info p {
            background: #F7941D;
            padding: 10px;
            color: #1E40AF;
            border-radius: 5px;
        }
        .buttons {
            display: flex;
            justify-content: center;
            margin-top: 20px;
            gap: 20px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 10px 20px;
            font-size: 16px;
            border: 2px solid;
            cursor: pointer;
            border-radius: 20px;
            width: 120px;
            transition: all 0.3s ease;
        }
        .btn-back {
            border-color: blue;
            color: blue;
            background: white;
        }
        .btn-next {
            border-color: orange;
            color: orange;
            background: white;
        }
        .btn-back:hover {
            border-color: blue;
            color: white;
            background: blue;
        }
        .btn-next:hover {
            border-color: orange;
            color: white;
            background: orange;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Before Clicking Submit, Verify all information is accurate and complete.</h2>

        <h2>Personal Information</h2>
        <div class="info">
            <p><strong>Name:</strong> <span id="name"></span></p>
            <p><strong>Email:</strong> <span id="email"></span></p>
            <p><strong>Age:</strong> <span id="age"></span></p>
            <p><strong>Address:</strong> <span id="address"></span></p>
            <p><strong>Sex:</strong> <span id="sex"></span></p>
            <p><strong>Birth Date:</strong> <span id="birthdate"></span></p>
            <p><strong>Status:</strong> <span id="status"></span></p>
            <p><strong>Phone #:</strong> <span id="phone"></span></p>
            <p><strong>Religion:</strong> <span id="religion"></span></p>
            <p><strong>Zip Code:</strong> <span id="zipcode"></span></p>
            <p><strong>Married:</strong> <span id="married"></span></p>
        </div>

        <h2>Business Information</h2>
        <div class="info">
            <p><strong>Business Name:</strong> <span id="businessName"></span></p>
            <p><strong>Years of Business:</strong> <span id="yearsBusiness"></span></p>
            <p><strong>Business Address:</strong> <span id="businessAddress"></span></p>
            <p><strong>Income:</strong> <span id="income"></span></p>
        </div>

        <div class="buttons">
            <a href="RequirementForm.html"><button class="btn btn-back">BACK</button></a>
            <a href="ReviewRequirement.html"><button class="btn btn-next" id="sendEmailButton">NEXT</button></a>
        </div>
    </div>

    <script>
        // Load data from localStorage
        window.onload = function () {
            document.getElementById('name').textContent = localStorage.getItem('name') || 'N/A';
            document.getElementById('email').textContent = localStorage.getItem('email') || 'N/A';
            document.getElementById('age').textContent = localStorage.getItem('age') || 'N/A';
            document.getElementById('address').textContent = localStorage.getItem('address') || 'N/A';
            document.getElementById('sex').textContent = localStorage.getItem('sex') || 'N/A';
            document.getElementById('birthdate').textContent = localStorage.getItem('birthdate') || 'N/A';
            document.getElementById('status').textContent = localStorage.getItem('status') || 'N/A';
            document.getElementById('phone').textContent = localStorage.getItem('phone') || 'N/A';
            document.getElementById('religion').textContent = localStorage.getItem('religion') || 'N/A';
            document.getElementById('zipcode').textContent = localStorage.getItem('zipcode') || 'N/A';
            document.getElementById('married').textContent = localStorage.getItem('married') || 'N/A';
    
            document.getElementById('businessName').textContent = localStorage.getItem('businessName') || 'N/A';
            document.getElementById('yearsBusiness').textContent = localStorage.getItem('yearsBusiness') || 'N/A';
            document.getElementById('businessAddress').textContent = localStorage.getItem('businessAddress') || 'N/A';
            document.getElementById('income').textContent = localStorage.getItem('income') || 'N/A';
        }
    
        // Generate and download PDF
        document.getElementById('sendEmailButton').addEventListener('click', function () {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
    
            // Get applicant's name for filename
            const applicantName = localStorage.getItem('name') || 'Applicant';
    
            // Adding personal info to the PDF
            doc.text(`Personal Information`, 10, 10);
            doc.text(`Name: ${applicantName}`, 10, 20);
            doc.text(`Email: ${localStorage.getItem('email') || 'N/A'}`, 10, 30);
            doc.text(`Age: ${localStorage.getItem('age') || 'N/A'}`, 10, 40);
            doc.text(`Address: ${localStorage.getItem('address') || 'N/A'}`, 10, 50);
            doc.text(`Sex: ${localStorage.getItem('sex') || 'N/A'}`, 10, 60);
            doc.text(`Birth Date: ${localStorage.getItem('birthdate') || 'N/A'}`, 10, 70);
            doc.text(`Status: ${localStorage.getItem('status') || 'N/A'}`, 10, 80);
            doc.text(`Phone #: ${localStorage.getItem('phone') || 'N/A'}`, 10, 90);
            doc.text(`Religion: ${localStorage.getItem('religion') || 'N/A'}`, 10, 100);
            doc.text(`Zip Code: ${localStorage.getItem('zipcode') || 'N/A'}`, 10, 110);
            doc.text(`Married: ${localStorage.getItem('married') || 'N/A'}`, 10, 120);
    
            doc.addPage(); // New page for business info
            doc.text(`Business Information`, 10, 10);
            doc.text(`Business Name: ${localStorage.getItem('businessName') || 'N/A'}`, 10, 20);
            doc.text(`Years of Business: ${localStorage.getItem('yearsBusiness') || 'N/A'}`, 10, 30);
            doc.text(`Business Address: ${localStorage.getItem('businessAddress') || 'N/A'}`, 10, 40);
            doc.text(`Income: ${localStorage.getItem('income') || 'N/A'}`, 10, 50);
    
            // Automatically download the PDF with applicant's name
            doc.save(`${applicantName}_file.pdf`);
            alert('Your PDF has been generated and stored. You can now access it on another page.');
        });
    </script>
    
    


</body>
</html>
